<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incident Command</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>INCIDENT COMMAND</h1>
      <span id="storage-badge" class="badge">checking storage…</span>
      <span class="spacer"></span>
      <span id="active-count" class="badge">0 active</span>
    </header>

    <main>
      <section class="panel">
        <h2>Declare incident</h2>
        <form id="declare-form">
          <label for="title">Title</label>
          <input id="title" name="title" required placeholder="API 5xx spike" />

          <div class="row">
            <div>
              <label for="severity">Severity</label>
              <select id="severity" name="severity">
                <option>SEV1</option>
                <option>SEV2</option>
                <option selected>SEV3</option>
                <option>SEV4</option>
              </select>
            </div>
            <div>
              <label for="commander">Incident commander</label>
              <input id="commander" name="commander" placeholder="you" />
            </div>
          </div>

          <label for="summary">Summary</label>
          <textarea id="summary" name="summary" placeholder="What is broken and who is affected?"></textarea>

          <label for="declare-submit">&nbsp;</label>
          <button id="declare-submit" type="submit">Declare</button>
        </form>

        <h2 style="margin-top: 20px">Incidents</h2>
        <div id="incident-list" class="incident-list"></div>

        <div class="row" style="margin-top: 12px">
          <button class="secondary" id="export-btn" type="button">Export JSON</button>
          <button class="secondary" id="import-btn" type="button">Import JSON</button>
        </div>
        <input id="import-file" type="file" accept="application/json" hidden />
      </section>

      <section class="panel" id="detail-panel">
        <div class="empty">Select or declare an incident to open the command view.</div>
      </section>
    </main>

    <footer>
      Data is stored in <code>data/incidents.json</code> when the local server is running, otherwise in browser storage.
    </footer>

    <script src="app.js"></script>
  </body>
</html>
